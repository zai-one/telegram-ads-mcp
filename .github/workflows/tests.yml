name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Security scan
        run: python scripts/check_security.py

      - name: Suite
        run: python -m pytest tests -q

      - name: Import
        run: python -c "from telegram_ads_mcp.server import mcp; print(mcp.name); import tg_ads_mcp; print(tg_ads_mcp.__version__)"
