[project]
name = "tg-ads-mcp"
version = "0.1.0"
description = "MCP server for the Telegram Ads platform — TON and EUR cabinets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Nikita Zhidkov" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "telegram",
    "telegram-ads",
    "advertising",
    "ton",
    "ai-agents",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/NikitaZhidkov/tg-ads-mcp"
Repository = "https://github.com/NikitaZhidkov/tg-ads-mcp"
Issues = "https://github.com/NikitaZhidkov/tg-ads-mcp/issues"

[project.scripts]
tg-ads-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "client.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
