[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-ads-mcp"
version = "0.2.0"
description = "MCP server for Telegram Ads. Currency is Gram. Built by ZAI.ONE."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Aleksandr / zai-one" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "telegram",
    "telegram-ads",
    "advertising",
    "ton",
    "gram",
    "ai-agents",
    "llm",
    "zai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.1.1,<3",
    "httpx>=0.27.0,<1",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/zai-one/telegram-ads-mcp"
Repository = "https://github.com/zai-one/telegram-ads-mcp"
Issues = "https://github.com/zai-one/telegram-ads-mcp/issues"
Changelog = "https://github.com/zai-one/telegram-ads-mcp/blob/master/CHANGELOG.md"

[project.scripts]
telegram-ads-mcp = "telegram_ads_mcp.server:main"
tg-ads-mcp = "telegram_ads_mcp.server:main"

[tool.setuptools.packages.find]
include = ["telegram_ads_mcp*", "tg_ads_mcp*"]

[tool.setuptools.package-data]
telegram_ads_mcp = ["py.typed", "AGENTS.md"]
tg_ads_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"
